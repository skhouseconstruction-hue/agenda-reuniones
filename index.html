<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>Mi Agenda</title>
<style>
:root{--blue:#1d4ed8;--bg:#f3f6fb;--text:#172033;--muted:#687386;--line:#e5eaf2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:var(--text)}
.app{max-width:720px;margin:auto;min-height:100vh;padding:16px 14px 32px}
header{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:24px;padding:24px 20px;margin-bottom:16px}
h1{margin:0;font-size:28px}header p{margin:7px 0 0;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;background:#fff;border-radius:18px;padding:18px 14px;text-align:left;box-shadow:0 5px 18px #17203312;min-height:98px;font-size:15px;font-weight:700;color:var(--text)}
.card span{display:block;font-size:28px;margin-bottom:9px}
.panel{background:#fff;border-radius:22px;padding:18px;margin-top:14px;box-shadow:0 5px 18px #17203312}
.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center}
h2{margin:0 0 14px;font-size:21px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.full{grid-column:1/-1}label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:5px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;background:#fbfcfe}
textarea{min-height:90px;resize:vertical}.actions,.tools{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}
.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:700}.primary{background:var(--blue);color:#fff}
.secondary{background:#eef2f7;color:#273247}.danger{background:#fee2e2;color:#991b1b}.small{font-size:12px;padding:9px 11px}
.item{border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:10px}
.itemhead{display:flex;justify-content:space-between;gap:8px}.badge{background:#e8efff;color:#1e40af;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}
.date{font-weight:700}.meta{color:var(--muted);font-size:14px;margin-top:5px}.notes{white-space:pre-wrap;margin-top:9px}
.itemactions{display:flex;gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:22px 5px}
@media(max-width:480px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<div class="app">
<header><h1>📅 Mi Agenda</h1><p>Reuniones · Visitas · Asignaciones · Eventos</p></header>

<section id="home">
<div class="grid">
<button class="card" onclick="openForm('Reunión de ancianos')"><span>👥</span>Reunión de ancianos</button>
<button class="card" onclick="openForm('Próxima visita')"><span>🏠</span>Próxima visita</button>
<button class="card" onclick="openForm('Día especial')"><span>🎤</span>Día especial</button>
<button class="card" onclick="openForm('Conmemoración')"><span>✝️</span>Conmemoración</button>
<button class="card" onclick="openForm('Asamblea')"><span>🏟️</span>Asamblea</button>
<button class="card" onclick="openForm('Reunión')"><span>📅</span>Reunión</button>
<button class="card" onclick="openForm('Asignación')"><span>📌</span>Asignación</button>
<button class="card" onclick="showAgenda()"><span>📋</span>Ver agenda</button>
</div>
</section>

<section id="formPanel" class="panel hidden">
<div class="top"><h2 id="formTitle">Nueva actividad</h2><button class="btn secondary small" onclick="goHome()">✕</button></div>
<form onsubmit="saveEvent(event)">
<input type="hidden" id="editId"><input type="hidden" id="type">
<div class="formgrid">
<div><label>Día / fecha</label><input id="date" type="date" required></div>
<div><label>Hora / horario</label><input id="time" type="time"></div>
<div id="speakerWrap"><label>Nombre del discursante / persona</label><input id="speaker"></div>
<div id="congWrap"><label>Congregación</label><input id="congregation"></div>
<div id="titleWrap" class="full"><label id="titleLabel">Nombre del discurso</label><input id="speech"></div>
<div id="placeWrap"><label>Lugar</label><input id="place"></div>
<div id="assignmentWrap"><label>Asignación</label><input id="assignment"></div>
<div id="extraWrap"><label>Tipo / detalle</label><input id="extra"></div>
<div class="full"><label>Notas</label><textarea id="notes"></textarea></div>
</div>
<div class="actions"><button class="btn primary" type="submit">GUARDAR</button><button class="btn secondary" type="button" onclick="goHome()">CANCELAR</button></div>
</form>
</section>

<section id="agendaPanel" class="panel hidden">
<div class="top"><h2>📋 Mi agenda</h2><button class="btn secondary small" onclick="goHome()">Volver</button></div>
<div class="tools"><select id="monthFilter" onchange="renderAgenda()"></select><button class="btn secondary small" onclick="allMonths()">Todos</button></div>
<div id="agendaList"></div>
</section>
</div>

<script>
const KEY='mi_agenda_reuniones_v1';
const icons={'Reunión de ancianos':'👥','Próxima visita':'🏠','Día especial':'🎤','Conmemoración':'✝️','Asamblea':'🏟️','Reunión':'📅','Asignación':'📌'};
let events=JSON.parse(localStorage.getItem(KEY)||'[]');

function $(id){return document.getElementById(id)}
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function openForm(type,id){
$('home').classList.add('hidden');$('agendaPanel').classList.add('hidden');$('formPanel').classList.remove('hidden');
$('formTitle').textContent=(id?'Editar ':'Nueva ')+type;$('type').value=type;$('editId').value=id||'';
let e=id?events.find(x=>x.id===id):null;
$('date').value=e?.date||new Date().toISOString().slice(0,10);$('time').value=e?.time||'';
$('speaker').value=e?.speaker||'';$('congregation').value=e?.congregation||'';$('speech').value=e?.speech||'';
$('place').value=e?.place||'';$('assignment').value=e?.assignment||'';$('extra').value=e?.extra||'';$('notes').value=e?.notes||'';
fields(type);scrollTo(0,0)
}
function fields(t){
$('speakerWrap').style.display=['Reunión de ancianos','Próxima visita','Día especial','Conmemoración','Reunión','Asignación'].includes(t)?'block':'none';
$('congWrap').style.display=['Próxima visita','Día especial','Conmemoración','Reunión','Asignación'].includes(t)?'block':'none';
$('titleWrap').style.display=['Reunión','Día especial','Asamblea'].includes(t)?'block':'none';
$('placeWrap').style.display=['Reunión de ancianos','Próxima visita','Asamblea'].includes(t)?'block':'none';
$('assignmentWrap').style.display=['Reunión','Asignación'].includes(t)?'block':'none';
$('extraWrap').style.display=t==='Asignación'?'block':'none';
$('titleLabel').textContent=t==='Reunión'?'Nombre del discurso':t==='Asamblea'?'Tipo de asamblea':'Nombre del discurso / detalle'
}
function saveEvent(ev){
ev.preventDefault();let id=$('editId').value||String(Date.now());
let e={id:id,type:$('type').value,date:$('date').value,time:$('time').value,speaker:$('speaker').value.trim(),congregation:$('congregation').value.trim(),speech:$('speech').value.trim(),place:$('place').value.trim(),assignment:$('assignment').value.trim(),extra:$('extra').value.trim(),notes:$('notes').value.trim()};
let i=events.findIndex(x=>x.id===id);if(i>=0)events[i]=e;else events.push(e);save();showAgenda()
}
function showAgenda(){$('home').classList.add('hidden');$('formPanel').classList.add('hidden');$('agendaPanel').classList.remove('hidden');buildMonths();renderAgenda();scrollTo(0,0)}
function goHome(){$('formPanel').classList.add('hidden');$('agendaPanel').classList.add('hidden');$('home').classList.remove('hidden')}
function buildMonths(){
let s=$('monthFilter'),now=new Date().toISOString().slice(0,7),ms=[...new Set(events.map(e=>e.date?.slice(0,7)).filter(Boolean))].sort().reverse();
if(!ms.includes(now))ms.unshift(now);s.innerHTML='<option value="">Este mes</option>'+ms.map(m=>'<option value="'+m+'">'+monthName(m)+'</option>').join('')
}
function monthName(m){let p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('es-MX',{month:'long',year:'numeric'})}
function allMonths(){$('monthFilter').value='*';renderAgenda()}
function renderAgenda(){
let f=$('monthFilter').value,arr=events.filter(e=>f==='*'||(e.date||'').startsWith(f||new Date().toISOString().slice(0,7))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
$('agendaList').innerHTML=arr.length?arr.map(e=>'<div class="item"><div class="itemhead"><span class="badge">'+(icons[e.type]||'📌')+' '+esc(e.type)+'</span><span class="date">'+fmt(e.date)+(e.time?' · '+esc(e.time):'')+'</span></div>'+
line(e.speech)+line(e.speaker)+line(e.congregation)+line(e.place)+line(e.assignment)+line(e.extra)+(e.notes?'<div class="notes">'+esc(e.notes)+'</div>':'')+
'<div class="itemactions"><button class="btn secondary small" onclick="openForm(\''+esc(e.type)+'\',\''+esc(e.id)+'\')">✏️ Editar</button><button class="btn danger small" onclick="del(\''+esc(e.id)+'\')">🗑️ Eliminar</button></div></div>').join(''):'<div class="empty">No hay actividades registradas.</div>'
}
function line(v){return v?'<div class="meta">'+esc(v)+'</div>':''}
function fmt(s){let p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'})}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function del(id){if(confirm('¿Eliminar esta actividad?')){events=events.filter(e=>e.id!==id);save();renderAgenda()}}
</script>
</body>
</html>
